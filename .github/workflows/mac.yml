name: macOS runner test

on:
  workflow_dispatch:
  push:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Basic system info
        run: |
          echo "Runner OS: $RUNNER_OS"
          sw_vers
          uname -a

      - name: Xcode check
        run: |
          xcodebuild -version

      - name: Simple command
        run: echo "macOS runner is working"
