name: Build and Publish Staging Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/laurynasjurys/juryslt

jobs:
  build-and-update:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore: deploy sha-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update deployment image to immutable SHA tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${IMAGE_NAME}:sha-${SHORT_SHA}"
          CURRENT_IMAGE="$(grep 'image:' k8s/deployment.yaml | awk '{print $2}')"
          if [ "${CURRENT_IMAGE}" = "${IMAGE}" ]; then
            echo "Deployment already references ${IMAGE}"
            exit 0
          fi
          sed -i "s|image: .*|image: ${IMAGE}|" k8s/deployment.yaml

      - name: Commit updated manifest
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: deploy sha-${SHORT_SHA}"
          git push
