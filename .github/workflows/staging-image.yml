name: Build and Publish Staging Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/laurynasjurys/juryslt

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-k3s-manifest:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: ${{ needs.build-and-publish.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout K3s repo
        uses: actions/checkout@v4
        with:
          repository: LaurynasJurys/K3s
          token: ${{ secrets.GH_PAT }}
          path: k3s

      - name: Update juryslt image digest
        env:
          IMAGE_REF: ${{ needs.build-and-publish.outputs.image_ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          image_ref = os.environ['IMAGE_REF']
          path = Path('k3s/apps/juryslt/manifests/deployment.yaml')
          text = path.read_text()
          new = re.sub(r'image:\s*ghcr\.io/laurynasjurys/juryslt(?:@sha256:[a-f0-9]+|:staging)', f'image: {image_ref}', text)
          if new == text:
              raise SystemExit('No image reference updated in deployment.yaml')
          path.write_text(new)
          print(f'Updated deployment to {image_ref}')
          PY

      - name: Commit and push manifest update
        run: |
          cd k3s
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/juryslt/manifests/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update juryslt staging image"
          git push
